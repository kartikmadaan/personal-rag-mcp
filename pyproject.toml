[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "personal-rag-mcp"
version = "0.1.0"
description = "Local-first personal knowledge base and MCP server backed by PostgreSQL + pgvector"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "openai>=1.50",
    "langchain-community>=0.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "tiktoken>=0.8",
    "pypdf>=5.0",
    "unstructured[md]>=0.15",
    "sentence-transformers>=3.0",
    "mcp>=1.0,<2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]
eval = [
    "ragas>=0.2",
    "datasets>=2.20",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-huggingface>=0.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests requiring a live PostgreSQL + pgvector database",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

